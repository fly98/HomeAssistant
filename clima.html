<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aria Camera</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Aria Camera">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* accent = colore dinamico del tema, cambia con la modalità */
    --blue: #3d9bd4; --blue-deep: #2176ab;
    --frost: rgba(255,255,255,0.55); --frost-strong: rgba(255,255,255,0.72);
    --line: rgba(255,255,255,0.6); --ink: #10384f; --ink-soft: #4a6b7d;
    --shadow: rgba(30,90,130,0.18); --warm: #e8925f; --ok: #5bbf9a;
    /* gradiente sfondo dinamico */
    --bg1: #eaf7ff; --bg2: #cbe9fa; --bg3: #a9d9f2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif; color: var(--ink);
    min-height: 100vh; padding: 12px 12px 28px; max-width: 620px; margin: 0 auto;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 40%, var(--bg3) 100%);
    background-attachment: fixed;
    transition: background 0.8s ease;
  }
  .glass {
    background: var(--frost); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 6px 22px var(--shadow);
    padding: 13px 14px; margin-bottom: 10px;
  }
  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; text-align: center; }
  .sub { font-size: 0.7rem; color: var(--ink-soft); margin: 2px 0 11px; font-weight: 500; }
  .card-title { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--ink-soft); margin-bottom: 9px; }
  .info-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
  @media (max-width:440px){ .info-grid { grid-template-columns: 1fr 1fr; } }
  .info-box { background: var(--frost-strong); border-radius: 12px; padding: 8px 9px; border: 1px solid rgba(255,255,255,0.7); }
  .info-label { font-size: 0.55rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.3px; font-weight: 600; line-height:1.2; }
  .info-value { font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif; font-size: 1.15rem; font-weight: 600; margin-top: 2px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .info-value small { font-size: 0.6rem; color: var(--ink-soft); font-weight: 500; }
  .thermo { display: flex; align-items: center; justify-content: space-between; }
  .thermo-center { flex:1; text-align:center; }
  .big-temp { font-family: -apple-system, 'SF Pro Display', 'Inter', sans-serif; font-size: 3.1rem; font-weight: 600; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; }
  .big-temp small { font-size: 1.1rem; color: var(--ink-soft); font-weight: 600; }
  .thermo-sub { font-size: 0.74rem; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
  .rbtn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--frost-strong); color: var(--blue-deep); font-size: 1.6rem; font-weight: 300; cursor: pointer; display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 8px var(--shadow); flex-shrink:0; }
  .rbtn:active { background: var(--blue); color: #fff; transform: scale(0.94); }
  .temp-col { display:flex; flex-direction:column; gap:12px; }
  .mode-chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:12px; }
  .mode-chip { flex:1; min-width:48px; text-align:center; background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); color:var(--ink); padding:8px 3px; border-radius:10px; font-size:0.68rem; font-weight:600; cursor:pointer; }
  .mode-chip.active { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; border-color:transparent; box-shadow: 0 4px 12px rgba(33,118,171,0.35); }
  .ctrl-block { padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.45); }
  .ctrl-block:last-child { border-bottom:none; }
  .ctrl-label { font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
  .ctrl-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.45); }
  .ctrl-row:last-child { border-bottom:none; }
  .pill-row { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar { display:none; }
  .pill { flex-shrink:0; background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); color:var(--ink); padding:6px 11px; border-radius:9px; font-size:0.72rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  .pill.active { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; border-color:transparent; }
  .toggle { width:44px; height:26px; border-radius:13px; background:rgba(120,150,170,0.4); position:relative; cursor:pointer; flex-shrink:0; transition:.25s; border:none; }
  .toggle.on { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); }
  .toggle::after { content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.25s; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
  .toggle.on::after { left:21px; }
  .disabled-block { opacity:0.4; pointer-events:none; }
  .warn { color: var(--warm); font-size:0.74rem; margin-top:10px; font-weight:600; }
  .off-badge { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ok); margin-left:5px; }
  .off-badge.bad { background:var(--warm); }
  .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .preset-card { background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); border-radius:14px; padding:11px; position:relative; }
  .preset-name { font-size:0.9rem; font-weight:700; }
  .preset-desc { font-size:0.64rem; color:var(--ink-soft); margin-top:3px; line-height:1.35; min-height:26px; }
  .preset-btns { display:flex; gap:5px; margin-top:8px; }
  .pbtn { flex:1; padding:7px; border-radius:8px; border:none; font-size:0.68rem; font-weight:700; cursor:pointer; }
  .pbtn-attiva { background:rgba(91,191,154,0.9); color:#fff; }
  .pbtn-mod { background:rgba(255,255,255,0.8); color:var(--blue-deep); }
  .modal-bg { position:fixed; inset:0; background:rgba(20,60,90,0.35); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:1000; display:none; align-items:flex-end; justify-content:center; }
  .modal-bg.show { display:flex; }
  .modal { background: rgba(255,255,255,0.85); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border-radius: 26px 26px 0 0; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding: 8px 18px 30px; border:1px solid rgba(255,255,255,0.8); animation: slideup .3s ease; }
  @keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width:40px; height:5px; background:rgba(120,150,170,0.5); border-radius:3px; margin:8px auto 16px; }
  .modal-title { font-size:1.25rem; font-weight:700; margin-bottom:4px; }
  .modal-sub { font-size:0.75rem; color:var(--ink-soft); margin-bottom:18px; }
  .modal-actions { display:flex; gap:10px; margin-top:22px; }
  .mbtn { flex:1; padding:14px; border-radius:13px; border:none; font-size:0.92rem; font-weight:700; cursor:pointer; }
  .mbtn-save { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; }
  .mbtn-cancel { background:rgba(120,150,170,0.2); color:var(--ink); }

  .switch-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:4px; }
  .switch-cell { display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--frost-strong); border:1px solid rgba(255,255,255,0.6); border-radius:11px; padding:9px 11px; }
  .switch-cell .sc-label { font-size:0.76rem; font-weight:600; line-height:1.15; }
  .switch-cell.disabled-block { opacity:0.4; pointer-events:none; }
  .selects-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  @media (max-width:440px){ .selects-grid { grid-template-columns:1fr; } }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(16,56,79,0.92); backdrop-filter:blur(10px); color:#fff; padding:13px 22px; border-radius:14px; font-weight:600; font-size:0.85rem; opacity:0; transition:.3s; pointer-events:none; z-index:2000; }
  .toast.show { opacity:1; }
</style>

<body>
<h1>Clima Camera</h1>
<div class="sub" style="padding:0 2px;">❄️ <span id="conn">connessione…</span> · <span style="opacity:0.6">v2.9</span></div>

<div class="glass">
  <div class="card-title">Stato attuale</div>
  <div class="info-grid">
    <div class="info-box"><div class="info-label">Temp. ambiente</div><div class="info-value" id="i-current">—<small>°C</small></div></div>
    <div class="info-box"><div class="info-label">Consumo oggi</div><div class="info-value" id="i-consumo">—<small>kWh</small></div></div>
    <div class="info-box"><div class="info-label">Corrente</div><div class="info-value" id="i-corrente">—<small>mA</small></div></div>
    <div class="info-box"><div class="info-label">Diagnostica</div><div class="info-value" id="i-diag" style="font-size:1rem;padding-top:8px">—</div></div>
  </div>
</div>

<div class="glass">
  <div class="thermo">
    <button class="rbtn" onclick="stepTemp(-1)">−</button>
    <div class="thermo-center">
      <div class="big-temp"><span id="t-target">—</span><small>°C</small></div>
      <div class="thermo-sub" id="t-mode">—</div>
    </div>
    <button class="rbtn" onclick="stepTemp(1)">+</button>
  </div>
  <div class="mode-chips" id="mode-chips"></div>
</div>

<div class="glass">
  <div class="card-title">Controlli</div>
  <div id="controls-container"></div>
  <div class="warn" id="ai-warn" style="display:none">❄️ Con l'AI attiva, alcuni controlli sono gestiti automaticamente.</div>
</div>

<div class="glass">
  <div class="card-title">Preset</div>
  <div class="preset-grid" id="preset-grid"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Modifica preset</div>
    <div class="modal-sub" id="modal-sub">Imposta i valori che questo preset applicherà.</div>
    <div style="margin:14px 0 18px">
      <label style="display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;opacity:.6;margin-bottom:6px">Nome del preset</label>
      <input id="preset-name" type="text" maxlength="40" placeholder="es. Notte camera"
        style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
               border-radius:12px;padding:11px 14px;color:inherit;font-size:1rem;font-family:inherit;outline:none">
    </div>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Annulla</button>
      <button class="mbtn mbtn-save" onclick="savePresetFromModal()">Salva preset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://ha-worker.f-castiglioni.workers.dev'

let KEY = localStorage.getItem('ha_key') || '';
function askKey(msg){
  if(document.getElementById('ulk')) return;
  const d=document.createElement('div'); d.id='ulk';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px';
  d.innerHTML='<div style="max-width:340px;width:100%;background:#16181d;border:1px solid #2a2e37;border-radius:20px;padding:28px 22px;text-align:center;color:#e7e9ee;font-family:system-ui,-apple-system,sans-serif;box-sizing:border-box">'
    +'<div style="font-size:38px;margin-bottom:10px">&#128274;</div>'
    +'<div style="font-size:18px;font-weight:700;margin-bottom:6px">Casa protetta</div>'
    +'<div style="font-size:13px;opacity:.7;margin-bottom:16px">'+(msg||'Inserisci la chiave di accesso. Resta salvata solo su questo dispositivo.')+'</div>'
    +'<input id="ulk-in" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Chiave" style="width:100%;box-sizing:border-box;background:#0e1014;border:1px solid #333a45;border-radius:12px;padding:12px 14px;color:#e7e9ee;font-size:15px;text-align:center;margin-bottom:12px">'
    +'<button id="ulk-b" style="width:100%;background:#f0a500;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;color:#111">Sblocca</button></div>';
  document.body.appendChild(d);
  const inp=d.querySelector('#ulk-in'), btn=d.querySelector('#ulk-b');
  const save=()=>{const v=inp.value.trim(); if(!v)return; localStorage.setItem('ha_key',v); location.reload();};
  btn.onclick=save; inp.onkeydown=e=>{if(e.key==='Enter')save()};
  setTimeout(()=>inp.focus(),120);
}
async function hfetch(path, opts){
  opts = opts || {};
  const h = Object.assign({}, opts.headers||{});
  if(KEY) h['X-API-Key']=KEY;
  const r = await fetch(WORKER+path, Object.assign({}, opts, {headers:h}));
  if(r.status===401){ KEY=''; localStorage.removeItem('ha_key'); askKey('Chiave non valida o mancante.'); const e=new Error('unauthorized'); e.code=401; throw e; }
  return r;
}

const BASE = 'camera_da_letto_condizionatore_camera'
const CLIMATE = 'climate.' + BASE
const SWITCHES = [
  { id:'ai', label:'AI', sub:'Regolazione automatica intelligente' },
  { id:'silenzioso', label:'Silenzioso', sub:'Ventola a basso rumore' },
  { id:'eco', label:'Eco', sub:'Risparmio energetico' },
  { id:'super', label:'Super', sub:'Massima potenza (turbo)' },
  { id:'dimmer', label:'Dimmer', sub:'Attenua display unità' },
  { id:'oscillazione_verticale', label:'Oscillazione verticale' },
  { id:'oscillazione_orizzontale', label:'Oscillazione orizzontale' },
  { id:'purificatore_dell_aria', label:'Purificatore aria' },
  { id:'aria_fresca', label:'Aria fresca', sub:'Ricambio aria' },
  { id:'protezione_antigelo', label:'Protezione antigelo' },
]
const SELECTS = [
  { id:'riposo', label:'Riposo (notte)', opts:['off','general','for_old','for_young','for_kid'], labels:{off:'Off',general:'Standard',for_old:'Anziani',for_young:'Adulti',for_kid:'Bimbi'} },
  { id:'ai_ventilazione', label:'AI ventilazione', opts:['off','follow','not_follow'], labels:{off:'Off',follow:'Segue',not_follow:'Non segue'} },
  { id:'compensazione_temperatura', label:'Compensazione temp.', opts:['offset_minus_3','offset_minus_2','offset_minus_1','offset_0','offset_plus_1','offset_plus_2','offset_plus_3'], labels:{offset_minus_3:'-3',offset_minus_2:'-2',offset_minus_1:'-1',offset_0:'0',offset_plus_1:'+1',offset_plus_2:'+2',offset_plus_3:'+3'} },
]
const MODES = [ {v:'off',l:'Spento'},{v:'cool',l:'Freddo'},{v:'heat',l:'Caldo'},{v:'dry',l:'Deumid.'},{v:'fan_only',l:'Ventola'},{v:'auto',l:'Auto/AI'} ]
const FAN = { opts:['auto','low','middle_low','medium','middle_high','high'], labels:{auto:'Auto',low:'Bassa',middle_low:'Med-bassa',medium:'Media',middle_high:'Med-alta',high:'Alta'} }
const AI_LOCKS = ['silenzioso','eco','super','riposo','fan_mode']
let STATE = {}
function sw(id){ return 'switch.'+BASE+'_'+id }
function sel(id){ return 'select.'+BASE+'_'+id }
async function callService(domain, service, entity_id, data) {
  const body = { domain, service, entity_id }; if (data) body.data = data
  try { const r = await hfetch('/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.ok } catch(e){ return false }
}
async function fetchStates() {
  try { const r = await hfetch('/states'); const all = await r.json(); const m={}; all.forEach(e=>{if(e.entity_id.includes(BASE))m[e.entity_id]=e}); return m } catch(e){ return null }
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200) }
function renderControls() {
  const c = document.getElementById('controls-container')
  const climateState = STATE[CLIMATE] ? STATE[CLIMATE].state : 'off'
  const aiOn = (climateState === 'auto') && STATE[sw('ai')] && STATE[sw('ai')].state === 'on'
  document.getElementById('ai-warn').style.display = aiOn ? 'block' : 'none'
  let html = ''
  const climate = STATE[CLIMATE]
  const fanMode = climate ? climate.attributes.fan_mode : null
  // La velocità ventola sul Hisense è valida SOLO in modalità Ventola:
  // inviarla in cool/dry/heat fa commutare l'unità in fan_only.
  const fanLocked = aiOn && AI_LOCKS.includes('fan_mode')
  // Ventola (piena larghezza, scroll pill)
  html += '<div class="ctrl-block '+(fanLocked?'disabled-block':'')+'"><div class="ctrl-label">Velocità ventola</div><div class="pill-row">'
  FAN.opts.forEach(o => html += '<div class="pill '+(fanMode===o?'active':'')+'" onclick="setFan(\''+o+'\')">'+FAN.labels[o]+'</div>')
  html += '</div></div>'
  // Selects in griglia 2 colonne
  html += '<div class="selects-grid">'
  SELECTS.forEach(s => {
    const cur = STATE[sel(s.id)] ? STATE[sel(s.id)].state : null
    let locked = aiOn && AI_LOCKS.includes(s.id)
    if (s.id==='compensazione_temperatura') locked = !aiOn  // compensazione ±3 solo con AI
    html += '<div class="ctrl-block '+(locked?'disabled-block':'')+'" style="border-bottom:none;padding:4px 0"><div class="ctrl-label">'+s.label+'</div><div class="pill-row">'
    s.opts.forEach(o => html += '<div class="pill '+(cur===o?'active':'')+'" onclick="setSelect(\''+s.id+'\',\''+o+'\')">'+(s.labels[o]||o)+'</div>')
    html += '</div></div>'
  })
  html += '</div>'
  // Switches in griglia 2 colonne compatta
  html += '<div class="switch-grid">'
  SWITCHES.forEach(s => {
    let on = STATE[sw(s.id)] && STATE[sw(s.id)].state === 'on'
    let locked = aiOn && AI_LOCKS.includes(s.id)
    // il toggle AI riflette la modalità: ON solo se auto, e disabilitato fuori da auto
    if (s.id==='ai') { on = (climateState==='auto'); locked = (climateState!=='auto') }
    html += '<div class="switch-cell '+(locked?'disabled-block':'')+'"><span class="sc-label">'+s.label+'</span><button class="toggle '+(on?'on':'')+'" onclick="toggleSwitch(\''+s.id+'\')"></button></div>'
  })
  html += '</div>'
  c.innerHTML = html
}
const THEMES = {
  off:      { blue:'#8a9aa5', deep:'#6b7a85', bg1:'#f2f4f6', bg2:'#e2e7ea', bg3:'#d0d7dc', ink:'#3a4750', inkSoft:'#6b7a85', shadow:'rgba(90,100,110,0.15)' },
  cool:     { blue:'#3d9bd4', deep:'#2176ab', bg1:'#eaf7ff', bg2:'#cbe9fa', bg3:'#a9d9f2', ink:'#10384f', inkSoft:'#4a6b7d', shadow:'rgba(30,90,130,0.18)' },
  dry:      { blue:'#4bb2c9', deep:'#2a8fa5', bg1:'#e8fbfc', bg2:'#c6f0f2', bg3:'#a2e2e6', ink:'#0f3f45', inkSoft:'#3f6f75', shadow:'rgba(30,120,130,0.18)' },
  fan_only: { blue:'#7aa8c4', deep:'#5a86a0', bg1:'#eef5f9', bg2:'#dbe8f0', bg3:'#c3d8e4', ink:'#26424f', inkSoft:'#546a76', shadow:'rgba(60,100,120,0.15)' },
  auto:     { blue:'#5aa9b8', deep:'#3a8494', bg1:'#e9f6f8', bg2:'#cde9ee', bg3:'#a8dae2', ink:'#123f47', inkSoft:'#436b73', shadow:'rgba(30,110,120,0.16)' },
  heat:     { blue:'#e8925f', deep:'#cf6b3a', bg1:'#fff2ea', bg2:'#ffd9c4', bg3:'#f5b89a', ink:'#5a2c12', inkSoft:'#8a5236', shadow:'rgba(180,80,40,0.18)' }
}
function applyTheme(mode) {
  const t = THEMES[mode] || THEMES.cool
  const r = document.documentElement.style
  r.setProperty('--blue', t.blue); r.setProperty('--blue-deep', t.deep)
  r.setProperty('--bg1', t.bg1); r.setProperty('--bg2', t.bg2); r.setProperty('--bg3', t.bg3)
  r.setProperty('--ink', t.ink); r.setProperty('--ink-soft', t.inkSoft); r.setProperty('--shadow', t.shadow)
}
function renderMode() {
  const climate = STATE[CLIMATE]; const cur = climate ? climate.state : 'off'
  applyTheme(cur)
  document.getElementById('mode-chips').innerHTML = MODES.map(m=>'<div class="mode-chip '+(cur===m.v?'active':'')+'" onclick="setMode(\''+m.v+'\')">'+m.l+'</div>').join('')
  document.getElementById('t-mode').textContent = (MODES.find(m=>m.v===cur)||{}).l || cur
}
function renderInfo() {
  const climate = STATE[CLIMATE]
  if (climate) {
    document.getElementById('t-target').textContent = climate.attributes.temperature != null ? climate.attributes.temperature : '—'
    document.getElementById('i-current').innerHTML = (climate.attributes.current_temperature != null ? climate.attributes.current_temperature : '—') + '<small>°C</small>'
  }
  const cons = STATE['sensor.'+BASE+'_consumo_energetico_giornaliero']
  const corr = STATE['sensor.'+BASE+'_elettricita']
  if (cons) document.getElementById('i-consumo').innerHTML = parseFloat(cons.state).toFixed(2)+'<small>kWh</small>'
  if (corr) document.getElementById('i-corrente').innerHTML = corr.state+'<small>mA</small>'
  let faults=0; Object.keys(STATE).forEach(k=>{ if(k.indexOf('binary_sensor.'+BASE)===0 && STATE[k].state==='on')faults++ })
  document.getElementById('i-diag').innerHTML = faults===0 ? 'OK <span class="off-badge"></span>' : faults+' <span class="off-badge bad"></span>'
}
function renderAll(){ renderInfo(); renderMode(); renderControls() }
async function stepTemp(d) {
  const climate=STATE[CLIMATE]; const min=(climate&&climate.attributes.min_temp)||16, max=(climate&&climate.attributes.max_temp)||32
  let t=((climate&&climate.attributes.temperature)||24)+d; t=Math.max(min,Math.min(max,t))
  document.getElementById('t-target').textContent=t
  await callService('climate','set_temperature',CLIMATE,{temperature:t}); scheduleRefresh()
}
async function setMode(m){ await callService('climate','set_hvac_mode',CLIMATE,{hvac_mode:m}); toast('Modalità: '+((MODES.find(x=>x.v===m)||{}).l||m)); scheduleRefresh() }
async function setFan(o){ await callService('climate','set_fan_mode',CLIMATE,{fan_mode:o}); scheduleRefresh() }
async function setSelect(id,o){ await callService('select','select_option',sel(id),{option:o}); scheduleRefresh() }
async function toggleSwitch(id){ const on=STATE[sw(id)]&&STATE[sw(id)].state==='on'; await callService('switch',on?'turn_off':'turn_on',sw(id)); scheduleRefresh() }
const PRESETS = [
  { id:'condizionatore_notte', name:'Notte', icon:'🌙' },
  { id:'aria_camera_1', name:'Aria 1', icon:'💧' },
  { id:'aria_camera_2', name:'Aria 2', icon:'❄️' },
  { id:'aria_camera_3', name:'Aria 3', icon:'🍃' },
]
let presetConfigs = {}
let editingPreset = null
let modalValues = {}
async function loadPreset(id) {
  try { const r = await hfetch('/script?id='+id); presetConfigs[id]=await r.json() } catch(e){ presetConfigs[id]=null }
}
function presetSummary(id) {
  const cfg = presetConfigs[id]; if(!cfg) return '…'
  let parts=[]
  ;(cfg.sequence||[]).forEach(s=>{
    if(s.action==='climate.set_hvac_mode') parts.push((MODES.find(m=>m.v===s.data.hvac_mode)||{}).l||s.data.hvac_mode)
    else if(s.action==='climate.set_temperature') parts.push(s.data.temperature+'°')
    else if(s.action==='select.select_option' && s.target.entity_id.indexOf('riposo')>=0 && s.data.option!=='off') parts.push('Riposo')
    else if(s.action==='switch.turn_on' && s.target.entity_id.indexOf('_ai')>=0 && s.target.entity_id.indexOf('ventilazione')<0) parts.push('AI')
  })
  return parts.slice(0,4).join(' · ') || 'vuoto'
}
async function renderPresets() {
  await Promise.all(PRESETS.map(p=>loadPreset(p.id)))
  document.getElementById('preset-grid').innerHTML = PRESETS.map(p=>
    '<div class="preset-card"><div class="preset-name">'+p.icon+' '+(((presetConfigs[p.id]||{}).alias)||p.name)+'</div>'+
    '<div class="preset-desc">'+presetSummary(p.id)+'</div>'+
    '<div class="preset-btns"><button class="pbtn pbtn-attiva" onclick="attivaPreset(\''+p.id+'\')">Attiva</button>'+
    '<button class="pbtn pbtn-mod" onclick="openModal(\''+p.id+'\')">Modifica</button></div></div>'
  ).join('')
}
async function attivaPreset(id) { await callService('script', id); toast('Attivato: '+(PRESETS.find(p=>p.id===id)||{}).name); scheduleRefresh(1500) }
function cfgToValues(cfg) {
  const v = { hvac_mode:'off', temperature:24, fan_mode:'auto' }
  SELECTS.forEach(s=>v[s.id]='off'); SWITCHES.forEach(s=>v['sw_'+s.id]=false)
  ;(cfg&&cfg.sequence||[]).forEach(s=>{
    if(s.action==='climate.set_hvac_mode') v.hvac_mode=s.data.hvac_mode
    else if(s.action==='climate.set_temperature') v.temperature=s.data.temperature
    else if(s.action==='climate.set_fan_mode') v.fan_mode=s.data.fan_mode
    else if(s.action==='select.select_option'){ const w=s.target.entity_id.replace('select.'+BASE+'_',''); v[w]=s.data.option }
    else if(s.action==='switch.turn_on'){ const w=s.target.entity_id.replace('switch.'+BASE+'_',''); v['sw_'+w]=true }
    else if(s.action==='switch.turn_off'){ const w=s.target.entity_id.replace('switch.'+BASE+'_',''); v['sw_'+w]=false }
  })
  return v
}
function openModal(id) {
  editingPreset = id
  modalValues = cfgToValues(presetConfigs[id])
  const p = PRESETS.find(x=>x.id===id)
  const _cfg = presetConfigs[id]
  document.getElementById('modal-title').textContent = p.icon+' '+((_cfg&&_cfg.alias)||p.name)
  document.getElementById('preset-name').value = (_cfg && _cfg.alias) ? _cfg.alias : p.name
  renderModalFields()
  document.getElementById('modal-bg').classList.add('show')
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); editingPreset=null }
function renderModalFields() {
  // AI blocca i controlli solo quando la modalità è 'auto' (AI vera e propria)
  const aiOn = (modalValues.hvac_mode === 'auto') && (modalValues.sw_ai === true)
  let h = '<div class="ctrl-block"><div class="ctrl-label">Modalità</div><div class="pill-row">'
  MODES.forEach(m=>h+='<div class="pill '+(modalValues.hvac_mode===m.v?'active':'')+'" onclick="mSet(\'hvac_mode\',\''+m.v+'\')">'+m.l+'</div>')
  h += '</div></div>'
  if (modalValues.hvac_mode!=='off') {
    h += '<div class="ctrl-row"><div class="ctrl-label" style="margin:0">Temperatura</div><div style="display:flex;align-items:center;gap:14px">'+
      '<button class="rbtn" style="width:42px;height:42px;font-size:1.4rem" onclick="mTemp(-1)">−</button>'+
      '<span style="font-size:1.5rem;font-weight:700;min-width:56px;text-align:center">'+modalValues.temperature+'°</span>'+
      '<button class="rbtn" style="width:42px;height:42px;font-size:1.4rem" onclick="mTemp(1)">+</button></div></div>'
    h += '<div class="ctrl-block '+(aiOn?'disabled-block':'')+'"><div class="ctrl-label">Velocità ventola</div><div class="pill-row">'
    FAN.opts.forEach(o=>h+='<div class="pill '+(modalValues.fan_mode===o?'active':'')+'" onclick="mSet(\'fan_mode\',\''+o+'\')">'+FAN.labels[o]+'</div>')
    h += '</div></div>'
  }
  SELECTS.forEach(s=>{
    let locked = aiOn && AI_LOCKS.includes(s.id)
    if (s.id==='compensazione_temperatura') locked = !aiOn  // la compensazione ±3 vale solo con AI attiva
    h += '<div class="ctrl-block '+(locked?'disabled-block':'')+'"><div class="ctrl-label">'+s.label+'</div><div class="pill-row">'
    s.opts.forEach(o=>h+='<div class="pill '+(modalValues[s.id]===o?'active':'')+'" onclick="mSet(\''+s.id+'\',\''+o+'\')">'+(s.labels[o]||o)+'</div>')
    h += '</div></div>'
  })
  SWITCHES.forEach(s=>{
    let locked = aiOn && AI_LOCKS.includes(s.id)
    let isOn = modalValues['sw_'+s.id]
    // Il toggle AI: ON solo se modalità auto, e disabilitato se non sei in auto
    if (s.id==='ai') { isOn = (modalValues.hvac_mode==='auto'); locked = (modalValues.hvac_mode!=='auto') }
    h += '<div class="ctrl-row '+(locked?'disabled-block':'')+'"><div><div style="font-weight:600;font-size:0.82rem">'+s.label+'</div>'+(s.sub?'<div style="font-size:0.7rem;color:var(--ink-soft)">'+s.sub+'</div>':'')+'</div><button class="toggle '+(isOn?'on':'')+'" onclick="mToggle(\''+s.id+'\')"></button></div>'
  })
  document.getElementById('modal-fields').innerHTML = h
}
function mSet(k,v){
  modalValues[k]=v
  // Coerenza AI <-> modalità: auto accende l'AI, le altre modalità la spengono
  if (k==='hvac_mode') {
    if (v==='auto') modalValues.sw_ai = true
    else modalValues.sw_ai = false
  }
  // Se accendo/spengo AI manualmente e sono in auto, ok; se accendo AI fuori da auto, riporto a auto
  renderModalFields()
}
function mTemp(d){ modalValues.temperature=Math.max(16,Math.min(32,modalValues.temperature+d)); renderModalFields() }
function mToggle(id){
  modalValues['sw_'+id]=!modalValues['sw_'+id]
  // Se accendo AI, porto la modalità su auto; se spengo AI mentre sono in auto, passo a cool
  if (id==='ai') {
    if (modalValues.sw_ai===true) modalValues.hvac_mode='auto'
    else if (modalValues.hvac_mode==='auto') modalValues.hvac_mode='cool'
  }
  renderModalFields()
}
async function savePresetFromModal() {
  const v = modalValues
  const seq = []
  // VERIFICATO SUL CAMPO (03/08/2026, 3 prove consecutive 8/8):
  // l'unita' passa dal cloud ConnectLife e SCARTA i comandi che arrivano in
  // raffica. Basta 1 secondo di respiro fra un comando e l'altro perche'
  // attecchiscano tutti. Senza pausa ne va a segno una minima parte.
  const GAP = 1
  const gap = ()=>seq.push({ delay:{seconds:GAP} })

  seq.push({ action:'climate.set_hvac_mode', target:{entity_id:CLIMATE}, data:{hvac_mode:v.hvac_mode} })
  if (v.hvac_mode!=='off') {
    // partendo da spento l'unita' ci mette qualche secondo a tornare online
    seq.push({ delay:{seconds:5} })
    seq.push({ action:'climate.set_temperature', target:{entity_id:CLIMATE}, data:{temperature:v.temperature} })
    if (!v.sw_ai) { gap(); seq.push({ action:'climate.set_fan_mode', target:{entity_id:CLIMATE}, data:{fan_mode:v.fan_mode} }) }
  }
  // L'AI sul Hisense e' una MODALITA', non un accessorio: switch.turn_off su 'ai'
  // fa uscire l'unita' dalla modalita' corrente e la manda in Ventilatore.
  // Con hvac_mode diverso da 'auto' l'AI e' gia' esclusa, quindi non va mai spenta esplicitamente.
  // Il purificatore si riprende il controllo della ventola: va acceso PER ULTIMO,
  // dopo i select, altrimenti sporca cio' che viene dopo di lui.
  const LAST = 'purificatore_dell_aria'
  SWITCHES.forEach(s=>{
    const on = v['sw_'+s.id]
    if (s.id==='ai' && !on) return
    if (s.id===LAST) return
    gap()
    seq.push({ action: on?'switch.turn_on':'switch.turn_off', target:{entity_id:sw(s.id)} })
  })
  // I select (Riposo su tutti) vanno emessi PER ULTIMI: sul Hisense il Riposo
  // ridefinisce la velocita' ventola, quindi deve avere l'ultima parola.
  SELECTS.forEach(s=>{ if(v[s.id] && v[s.id]!=='off'){ gap(); seq.push({ action:'select.select_option', target:{entity_id:sel(s.id)}, data:{option:v[s.id]} }) } })
  gap()
  seq.push({ action: v['sw_'+LAST]?'switch.turn_on':'switch.turn_off', target:{entity_id:sw(LAST)} })
  // Coda di verifica: dopo l'assestamento riapplica solo cio' che non ha fatto presa
  if (v.hvac_mode!=='off') {
    seq.push({ delay:{seconds:45} })
    SWITCHES.forEach(s=>{
      const on = v['sw_'+s.id]
      if (s.id==='ai' && !on) return
      seq.push({ if:[{condition:'state', entity_id:sw(s.id), state: on?'off':'on'}],
                 then:[{ action: on?'switch.turn_on':'switch.turn_off', target:{entity_id:sw(s.id)} }] })
    })
    SELECTS.forEach(s=>{ if(v[s.id] && v[s.id]!=='off')
      seq.push({ if:[{condition:'not', conditions:[{condition:'state', entity_id:sel(s.id), state:v[s.id]}]},],
                 then:[{ action:'select.select_option', target:{entity_id:sel(s.id)}, data:{option:v[s.id]} }] }) })
  }
  const cfg = presetConfigs[editingPreset]
  const _nm = (document.getElementById('preset-name').value||'').trim()
  const payload = { alias: _nm || (cfg&&cfg.alias) || (PRESETS.find(p=>p.id===editingPreset)||{}).name, icon: (cfg&&cfg.icon)||'mdi:snowflake', sequence:seq, mode:'single' }
  try {
    const r = await hfetch('/script?id='+editingPreset,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    const res = await r.json()
    if (res.ok){ toast('Preset salvato ✓'); await loadPreset(editingPreset); renderPresets(); closeModal() }
    else toast('Errore salvataggio')
  } catch(e){ toast('Errore salvataggio') }
}
let pollTimer=null
async function refresh(){ const s=await fetchStates(); if(s){STATE=s; renderAll(); document.getElementById('conn').textContent='agg. '+new Date().toLocaleTimeString('it-IT')} else document.getElementById('conn').textContent='offline' }
function scheduleRefresh(delay=800){ setTimeout(refresh,delay) }
function startPolling(){ stopPolling(); refresh(); pollTimer=setInterval(refresh,5000) }
function stopPolling(){ if(pollTimer)clearInterval(pollTimer); pollTimer=null }
document.addEventListener('visibilitychange',()=>{ if(document.hidden)stopPolling(); else startPolling() })
// Prova ad aggiornare il widget Scriptable quando si lascia la pagina (best-effort)
let lastWidgetRefresh = 0
renderPresets()
startPolling()
</script>
