<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clima Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #3d9bd4; --blue-deep: #2176ab;
    --frost: rgba(255,255,255,0.55); --frost-strong: rgba(255,255,255,0.72);
    --line: rgba(255,255,255,0.6); --ink: #10384f; --ink-soft: #4a6b7d;
    --shadow: rgba(30,90,130,0.18); --warm: #e8925f; --ok: #5bbf9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif; color: var(--ink);
    min-height: 100vh; padding: 18px 16px 40px; max-width: 640px; margin: 0 auto;
    background: linear-gradient(160deg, #eaf7ff 0%, #cbe9fa 40%, #a9d9f2 100%);
    background-attachment: fixed;
  }
  .glass {
    background: var(--frost); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 8px 30px var(--shadow);
    padding: 18px; margin-bottom: 14px;
  }
  h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.5px; }
  .sub { font-size: 0.74rem; color: var(--ink-soft); margin: 2px 0 16px; font-weight: 500; }
  .card-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 14px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-box { background: var(--frost-strong); border-radius: 14px; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.7); }
  .info-label { font-size: 0.64rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .info-value { font-size: 1.4rem; font-weight: 700; margin-top: 3px; letter-spacing: -0.5px; }
  .info-value small { font-size: 0.7rem; color: var(--ink-soft); font-weight: 500; }
  .thermo { display: flex; align-items: center; justify-content: space-between; }
  .big-temp { font-size: 4rem; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  .big-temp small { font-size: 1.4rem; color: var(--ink-soft); font-weight: 600; }
  .thermo-sub { font-size: 0.82rem; color: var(--ink-soft); font-weight: 500; margin-top: 4px; }
  .rbtn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--frost-strong); color: var(--blue-deep); font-size: 1.9rem; font-weight: 300; cursor: pointer; display:flex; align-items:center; justify-content:center; box-shadow: 0 3px 10px var(--shadow); }
  .rbtn:active { background: var(--blue); color: #fff; transform: scale(0.94); }
  .temp-col { display:flex; flex-direction:column; gap:12px; }
  .mode-chips { display:flex; gap:7px; flex-wrap:wrap; margin-top:16px; }
  .mode-chip { flex:1; min-width:56px; text-align:center; background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); color:var(--ink); padding:11px 4px; border-radius:13px; font-size:0.76rem; font-weight:600; cursor:pointer; }
  .mode-chip.active { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; border-color:transparent; box-shadow: 0 4px 12px rgba(33,118,171,0.35); }
  .ctrl-block { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.5); }
  .ctrl-block:last-child { border-bottom:none; }
  .ctrl-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
  .ctrl-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.5); }
  .ctrl-row:last-child { border-bottom:none; }
  .pill-row { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar { display:none; }
  .pill { flex-shrink:0; background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); color:var(--ink); padding:8px 13px; border-radius:11px; font-size:0.78rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  .pill.active { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; border-color:transparent; }
  .toggle { width:50px; height:30px; border-radius:15px; background:rgba(120,150,170,0.4); position:relative; cursor:pointer; flex-shrink:0; transition:.25s; border:none; }
  .toggle.on { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); }
  .toggle::after { content:''; position:absolute; width:24px; height:24px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.25s; box-shadow:0 2px 5px rgba(0,0,0,0.2); }
  .toggle.on::after { left:23px; }
  .disabled-block { opacity:0.4; pointer-events:none; }
  .warn { color: var(--warm); font-size:0.74rem; margin-top:10px; font-weight:600; }
  .off-badge { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ok); margin-left:5px; }
  .off-badge.bad { background:var(--warm); }
  .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .preset-card { background:var(--frost-strong); border:1px solid rgba(255,255,255,0.7); border-radius:16px; padding:14px; position:relative; }
  .preset-name { font-size:1rem; font-weight:700; }
  .preset-desc { font-size:0.7rem; color:var(--ink-soft); margin-top:4px; line-height:1.4; min-height:32px; }
  .preset-btns { display:flex; gap:6px; margin-top:10px; }
  .pbtn { flex:1; padding:8px; border-radius:9px; border:none; font-size:0.74rem; font-weight:700; cursor:pointer; }
  .pbtn-attiva { background:rgba(91,191,154,0.9); color:#fff; }
  .pbtn-mod { background:rgba(255,255,255,0.8); color:var(--blue-deep); }
  .modal-bg { position:fixed; inset:0; background:rgba(20,60,90,0.35); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:1000; display:none; align-items:flex-end; justify-content:center; }
  .modal-bg.show { display:flex; }
  .modal { background: rgba(255,255,255,0.85); backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%); border-radius: 26px 26px 0 0; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding: 8px 18px 30px; border:1px solid rgba(255,255,255,0.8); animation: slideup .3s ease; }
  @keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width:40px; height:5px; background:rgba(120,150,170,0.5); border-radius:3px; margin:8px auto 16px; }
  .modal-title { font-size:1.25rem; font-weight:700; margin-bottom:4px; }
  .modal-sub { font-size:0.75rem; color:var(--ink-soft); margin-bottom:18px; }
  .modal-actions { display:flex; gap:10px; margin-top:22px; }
  .mbtn { flex:1; padding:14px; border-radius:13px; border:none; font-size:0.92rem; font-weight:700; cursor:pointer; }
  .mbtn-save { background: linear-gradient(135deg,var(--blue),var(--blue-deep)); color:#fff; }
  .mbtn-cancel { background:rgba(120,150,170,0.2); color:var(--ink); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:rgba(16,56,79,0.92); backdrop-filter:blur(10px); color:#fff; padding:13px 22px; border-radius:14px; font-weight:600; font-size:0.85rem; opacity:0; transition:.3s; pointer-events:none; z-index:2000; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<h1>Clima Camera</h1>
<div class="sub">❄️ Camera da letto · <span id="conn">connessione…</span></div>

<div class="glass">
  <div class="card-title">Stato attuale</div>
  <div class="info-grid">
    <div class="info-box"><div class="info-label">Temp. ambiente</div><div class="info-value" id="i-current">—<small>°C</small></div></div>
    <div class="info-box"><div class="info-label">Consumo oggi</div><div class="info-value" id="i-consumo">—<small>kWh</small></div></div>
    <div class="info-box"><div class="info-label">Corrente</div><div class="info-value" id="i-corrente">—<small>mA</small></div></div>
    <div class="info-box"><div class="info-label">Diagnostica</div><div class="info-value" id="i-diag" style="font-size:1rem;padding-top:8px">—</div></div>
  </div>
</div>

<div class="glass">
  <div class="thermo">
    <div>
      <div class="big-temp"><span id="t-target">—</span><small>°C</small></div>
      <div class="thermo-sub" id="t-mode">—</div>
    </div>
    <div class="temp-col">
      <button class="rbtn" onclick="stepTemp(1)">+</button>
      <button class="rbtn" onclick="stepTemp(-1)">−</button>
    </div>
  </div>
  <div class="mode-chips" id="mode-chips"></div>
</div>

<div class="glass">
  <div class="card-title">Controlli</div>
  <div id="controls-container"></div>
  <div class="warn" id="ai-warn" style="display:none">❄️ Con l'AI attiva, alcuni controlli sono gestiti automaticamente.</div>
</div>

<div class="glass">
  <div class="card-title">Preset</div>
  <div class="preset-grid" id="preset-grid"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">Modifica preset</div>
    <div class="modal-sub" id="modal-sub">Imposta i valori che questo preset applicherà.</div>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Annulla</button>
      <button class="mbtn mbtn-save" onclick="savePresetFromModal()">Salva preset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKER = 'https://ha-worker.f-castiglioni.workers.dev'
const BASE = 'camera_da_letto_condizionatore_camera'
const CLIMATE = 'climate.' + BASE
const SWITCHES = [
  { id:'ai', label:'AI', sub:'Regolazione automatica intelligente' },
  { id:'silenzioso', label:'Silenzioso', sub:'Ventola a basso rumore' },
  { id:'eco', label:'Eco', sub:'Risparmio energetico' },
  { id:'super', label:'Super', sub:'Massima potenza (turbo)' },
  { id:'dimmer', label:'Dimmer', sub:'Attenua display unità' },
  { id:'oscillazione_verticale', label:'Oscillazione verticale' },
  { id:'oscillazione_orizzontale', label:'Oscillazione orizzontale' },
  { id:'purificatore_dell_aria', label:'Purificatore aria' },
  { id:'aria_fresca', label:'Aria fresca', sub:'Ricambio aria' },
  { id:'protezione_antigelo', label:'Protezione antigelo' },
]
const SELECTS = [
  { id:'riposo', label:'Riposo (notte)', opts:['off','general','for_old','for_young','for_kid'], labels:{off:'Off',general:'Standard',for_old:'Anziani',for_young:'Adulti',for_kid:'Bimbi'} },
  { id:'ai_ventilazione', label:'AI ventilazione', opts:['off','follow','not_follow'], labels:{off:'Off',follow:'Segue',not_follow:'Non segue'} },
  { id:'compensazione_temperatura', label:'Compensazione temp.', opts:['offset_minus_3','offset_minus_2','offset_minus_1','offset_0','offset_plus_1','offset_plus_2','offset_plus_3'], labels:{offset_minus_3:'-3',offset_minus_2:'-2',offset_minus_1:'-1',offset_0:'0',offset_plus_1:'+1',offset_plus_2:'+2',offset_plus_3:'+3'} },
]
const MODES = [ {v:'off',l:'Spento'},{v:'cool',l:'Freddo'},{v:'heat',l:'Caldo'},{v:'dry',l:'Deumid.'},{v:'fan_only',l:'Ventola'},{v:'auto',l:'Auto/AI'} ]
const FAN = { opts:['auto','low','middle_low','medium','middle_high','high'], labels:{auto:'Auto',low:'Bassa',middle_low:'Med-bassa',medium:'Media',middle_high:'Med-alta',high:'Alta'} }
const AI_LOCKS = ['silenzioso','eco','super','riposo','fan_mode']
let STATE = {}
function sw(id){ return 'switch.'+BASE+'_'+id }
function sel(id){ return 'select.'+BASE+'_'+id }
async function callService(domain, service, entity_id, data) {
  const body = { domain, service, entity_id }; if (data) body.data = data
  try { const r = await fetch(WORKER+'/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.ok } catch(e){ return false }
}
async function fetchStates() {
  try { const r = await fetch(WORKER+'/states'); const all = await r.json(); const m={}; all.forEach(e=>{if(e.entity_id.includes(BASE))m[e.entity_id]=e}); return m } catch(e){ return null }
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200) }
function renderControls() {
  const c = document.getElementById('controls-container')
  const aiOn = STATE[sw('ai')] && STATE[sw('ai')].state === 'on'
  document.getElementById('ai-warn').style.display = aiOn ? 'block' : 'none'
  let html = ''
  const climate = STATE[CLIMATE]
  const fanMode = climate ? climate.attributes.fan_mode : null
  const fanLocked = aiOn && AI_LOCKS.includes('fan_mode')
  html += '<div class="ctrl-block '+(fanLocked?'disabled-block':'')+'"><div class="ctrl-label">Velocità ventola</div><div class="pill-row">'
  FAN.opts.forEach(o => html += '<div class="pill '+(fanMode===o?'active':'')+'" onclick="setFan(\''+o+'\')">'+FAN.labels[o]+'</div>')
  html += '</div></div>'
  SELECTS.forEach(s => {
    const cur = STATE[sel(s.id)] ? STATE[sel(s.id)].state : null
    const locked = aiOn && AI_LOCKS.includes(s.id)
    html += '<div class="ctrl-block '+(locked?'disabled-block':'')+'"><div class="ctrl-label">'+s.label+'</div><div class="pill-row">'
    s.opts.forEach(o => html += '<div class="pill '+(cur===o?'active':'')+'" onclick="setSelect(\''+s.id+'\',\''+o+'\')">'+(s.labels[o]||o)+'</div>')
    html += '</div></div>'
  })
  SWITCHES.forEach(s => {
    const on = STATE[sw(s.id)] && STATE[sw(s.id)].state === 'on'
    const locked = aiOn && AI_LOCKS.includes(s.id)
    html += '<div class="ctrl-row '+(locked?'disabled-block':'')+'"><div><div style="font-weight:600;font-size:0.9rem">'+s.label+'</div>'+(s.sub?'<div style="font-size:0.7rem;color:var(--ink-soft)">'+s.sub+'</div>':'')+'</div><button class="toggle '+(on?'on':'')+'" onclick="toggleSwitch(\''+s.id+'\')"></button></div>'
  })
  c.innerHTML = html
}
function renderMode() {
  const climate = STATE[CLIMATE]; const cur = climate ? climate.state : 'off'
  document.getElementById('mode-chips').innerHTML = MODES.map(m=>'<div class="mode-chip '+(cur===m.v?'active':'')+'" onclick="setMode(\''+m.v+'\')">'+m.l+'</div>').join('')
  document.getElementById('t-mode').textContent = (MODES.find(m=>m.v===cur)||{}).l || cur
}
function renderInfo() {
  const climate = STATE[CLIMATE]
  if (climate) {
    document.getElementById('t-target').textContent = climate.attributes.temperature != null ? climate.attributes.temperature : '—'
    document.getElementById('i-current').innerHTML = (climate.attributes.current_temperature != null ? climate.attributes.current_temperature : '—') + '<small>°C</small>'
  }
  const cons = STATE['sensor.'+BASE+'_consumo_energetico_giornaliero']
  const corr = STATE['sensor.'+BASE+'_elettricita']
  if (cons) document.getElementById('i-consumo').innerHTML = parseFloat(cons.state).toFixed(2)+'<small>kWh</small>'
  if (corr) document.getElementById('i-corrente').innerHTML = corr.state+'<small>mA</small>'
  let faults=0; Object.keys(STATE).forEach(k=>{ if(k.indexOf('binary_sensor.'+BASE)===0 && STATE[k].state==='on')faults++ })
  document.getElementById('i-diag').innerHTML = faults===0 ? 'OK <span class="off-badge"></span>' : faults+' <span class="off-badge bad"></span>'
}
function renderAll(){ renderInfo(); renderMode(); renderControls() }
async function stepTemp(d) {
  const climate=STATE[CLIMATE]; const min=(climate&&climate.attributes.min_temp)||16, max=(climate&&climate.attributes.max_temp)||32
  let t=((climate&&climate.attributes.temperature)||24)+d; t=Math.max(min,Math.min(max,t))
  document.getElementById('t-target').textContent=t
  await callService('climate','set_temperature',CLIMATE,{temperature:t}); scheduleRefresh()
}
async function setMode(m){ await callService('climate','set_hvac_mode',CLIMATE,{hvac_mode:m}); toast('Modalità: '+((MODES.find(x=>x.v===m)||{}).l||m)); scheduleRefresh() }
async function setFan(o){ await callService('climate','set_fan_mode',CLIMATE,{fan_mode:o}); scheduleRefresh() }
async function setSelect(id,o){ await callService('select','select_option',sel(id),{option:o}); scheduleRefresh() }
async function toggleSwitch(id){ const on=STATE[sw(id)]&&STATE[sw(id)].state==='on'; await callService('switch',on?'turn_off':'turn_on',sw(id)); scheduleRefresh() }
const PRESETS = [
  { id:'condizionatore_notte', name:'Notte', icon:'🌙' },
  { id:'aria_camera_1', name:'Aria 1', icon:'💧' },
  { id:'aria_camera_2', name:'Aria 2', icon:'❄️' },
  { id:'aria_camera_3', name:'Aria 3', icon:'🍃' },
]
let presetConfigs = {}
let editingPreset = null
let modalValues = {}
async function loadPreset(id) {
  try { const r = await fetch(WORKER+'/script?id='+id); presetConfigs[id]=await r.json() } catch(e){ presetConfigs[id]=null }
}
function presetSummary(id) {
  const cfg = presetConfigs[id]; if(!cfg) return '…'
  let parts=[]
  ;(cfg.sequence||[]).forEach(s=>{
    if(s.action==='climate.set_hvac_mode') parts.push((MODES.find(m=>m.v===s.data.hvac_mode)||{}).l||s.data.hvac_mode)
    else if(s.action==='climate.set_temperature') parts.push(s.data.temperature+'°')
    else if(s.action==='select.select_option' && s.target.entity_id.indexOf('riposo')>=0 && s.data.option!=='off') parts.push('Riposo')
    else if(s.action==='switch.turn_on' && s.target.entity_id.indexOf('_ai')>=0 && s.target.entity_id.indexOf('ventilazione')<0) parts.push('AI')
  })
  return parts.slice(0,4).join(' · ') || 'vuoto'
}
async function renderPresets() {
  await Promise.all(PRESETS.map(p=>loadPreset(p.id)))
  document.getElementById('preset-grid').innerHTML = PRESETS.map(p=>
    '<div class="preset-card"><div class="preset-name">'+p.icon+' '+p.name+'</div>'+
    '<div class="preset-desc">'+presetSummary(p.id)+'</div>'+
    '<div class="preset-btns"><button class="pbtn pbtn-attiva" onclick="attivaPreset(\''+p.id+'\')">Attiva</button>'+
    '<button class="pbtn pbtn-mod" onclick="openModal(\''+p.id+'\')">Modifica</button></div></div>'
  ).join('')
}
async function attivaPreset(id) { await callService('script', id); toast('Attivato: '+(PRESETS.find(p=>p.id===id)||{}).name); scheduleRefresh(1500) }
function cfgToValues(cfg) {
  const v = { hvac_mode:'off', temperature:24, fan_mode:'auto' }
  SELECTS.forEach(s=>v[s.id]='off'); SWITCHES.forEach(s=>v['sw_'+s.id]=false)
  ;(cfg&&cfg.sequence||[]).forEach(s=>{
    if(s.action==='climate.set_hvac_mode') v.hvac_mode=s.data.hvac_mode
    else if(s.action==='climate.set_temperature') v.temperature=s.data.temperature
    else if(s.action==='climate.set_fan_mode') v.fan_mode=s.data.fan_mode
    else if(s.action==='select.select_option'){ const w=s.target.entity_id.replace('select.'+BASE+'_',''); v[w]=s.data.option }
    else if(s.action==='switch.turn_on'){ const w=s.target.entity_id.replace('switch.'+BASE+'_',''); v['sw_'+w]=true }
    else if(s.action==='switch.turn_off'){ const w=s.target.entity_id.replace('switch.'+BASE+'_',''); v['sw_'+w]=false }
  })
  return v
}
function openModal(id) {
  editingPreset = id
  modalValues = cfgToValues(presetConfigs[id])
  const p = PRESETS.find(x=>x.id===id)
  document.getElementById('modal-title').textContent = p.icon+' '+p.name
  renderModalFields()
  document.getElementById('modal-bg').classList.add('show')
}
function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); editingPreset=null }
function renderModalFields() {
  const aiOn = modalValues.sw_ai === true
  let h = '<div class="ctrl-block"><div class="ctrl-label">Modalità</div><div class="pill-row">'
  MODES.forEach(m=>h+='<div class="pill '+(modalValues.hvac_mode===m.v?'active':'')+'" onclick="mSet(\'hvac_mode\',\''+m.v+'\')">'+m.l+'</div>')
  h += '</div></div>'
  if (modalValues.hvac_mode!=='off') {
    h += '<div class="ctrl-row"><div class="ctrl-label" style="margin:0">Temperatura</div><div style="display:flex;align-items:center;gap:14px">'+
      '<button class="rbtn" style="width:42px;height:42px;font-size:1.4rem" onclick="mTemp(-1)">−</button>'+
      '<span style="font-size:1.5rem;font-weight:700;min-width:56px;text-align:center">'+modalValues.temperature+'°</span>'+
      '<button class="rbtn" style="width:42px;height:42px;font-size:1.4rem" onclick="mTemp(1)">+</button></div></div>'
    h += '<div class="ctrl-block '+(aiOn?'disabled-block':'')+'"><div class="ctrl-label">Velocità ventola</div><div class="pill-row">'
    FAN.opts.forEach(o=>h+='<div class="pill '+(modalValues.fan_mode===o?'active':'')+'" onclick="mSet(\'fan_mode\',\''+o+'\')">'+FAN.labels[o]+'</div>')
    h += '</div></div>'
  }
  SELECTS.forEach(s=>{
    const locked = aiOn && AI_LOCKS.includes(s.id)
    h += '<div class="ctrl-block '+(locked?'disabled-block':'')+'"><div class="ctrl-label">'+s.label+'</div><div class="pill-row">'
    s.opts.forEach(o=>h+='<div class="pill '+(modalValues[s.id]===o?'active':'')+'" onclick="mSet(\''+s.id+'\',\''+o+'\')">'+(s.labels[o]||o)+'</div>')
    h += '</div></div>'
  })
  SWITCHES.forEach(s=>{
    const locked = aiOn && AI_LOCKS.includes(s.id)
    h += '<div class="ctrl-row '+(locked?'disabled-block':'')+'"><div><div style="font-weight:600;font-size:0.9rem">'+s.label+'</div>'+(s.sub?'<div style="font-size:0.7rem;color:var(--ink-soft)">'+s.sub+'</div>':'')+'</div><button class="toggle '+(modalValues['sw_'+s.id]?'on':'')+'" onclick="mToggle(\''+s.id+'\')"></button></div>'
  })
  document.getElementById('modal-fields').innerHTML = h
}
function mSet(k,v){ modalValues[k]=v; renderModalFields() }
function mTemp(d){ modalValues.temperature=Math.max(16,Math.min(32,modalValues.temperature+d)); renderModalFields() }
function mToggle(id){ modalValues['sw_'+id]=!modalValues['sw_'+id]; renderModalFields() }
async function savePresetFromModal() {
  const v = modalValues
  const seq = []
  seq.push({ action:'climate.set_hvac_mode', target:{entity_id:CLIMATE}, data:{hvac_mode:v.hvac_mode} })
  if (v.hvac_mode!=='off') {
    seq.push({ action:'climate.set_temperature', target:{entity_id:CLIMATE}, data:{temperature:v.temperature} })
    if (!v.sw_ai) seq.push({ action:'climate.set_fan_mode', target:{entity_id:CLIMATE}, data:{fan_mode:v.fan_mode} })
  }
  SELECTS.forEach(s=>{ if(v[s.id] && v[s.id]!=='off') seq.push({ action:'select.select_option', target:{entity_id:sel(s.id)}, data:{option:v[s.id]} }) })
  SWITCHES.forEach(s=>{ seq.push({ action: v['sw_'+s.id]?'switch.turn_on':'switch.turn_off', target:{entity_id:sw(s.id)} }) })
  const cfg = presetConfigs[editingPreset]
  const payload = { alias: (cfg&&cfg.alias) || (PRESETS.find(p=>p.id===editingPreset)||{}).name, icon: (cfg&&cfg.icon)||'mdi:snowflake', sequence:seq, mode:'single' }
  try {
    const r = await fetch(WORKER+'/script?id='+editingPreset,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    const res = await r.json()
    if (res.ok){ toast('Preset salvato ✓'); await loadPreset(editingPreset); renderPresets(); closeModal() }
    else toast('Errore salvataggio')
  } catch(e){ toast('Errore salvataggio') }
}
let pollTimer=null
async function refresh(){ const s=await fetchStates(); if(s){STATE=s; renderAll(); document.getElementById('conn').textContent='agg. '+new Date().toLocaleTimeString('it-IT')} else document.getElementById('conn').textContent='offline' }
function scheduleRefresh(delay=800){ setTimeout(refresh,delay) }
function startPolling(){ stopPolling(); refresh(); pollTimer=setInterval(refresh,5000) }
function stopPolling(){ if(pollTimer)clearInterval(pollTimer); pollTimer=null }
document.addEventListener('visibilitychange',()=>{ if(document.hidden)stopPolling(); else startPolling() })
renderPresets()
startPolling()
</script>
